{% extends "base.html" %}

{% block title %}Удалить товар — Skystore{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1>Удалить товар?</h1>

    <p>Вы уверены, что хотите удалить товар <strong>«{{ product.name }}»</strong>? Это действие нельзя отменить.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'catalog:product_detail' pk=product.pk %}" class="btn btn-outline-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
