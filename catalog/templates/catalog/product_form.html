{% extends "base.html" %}

{% block title %}Добавить товар — Skystore{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">Добавить товар</h1>

    <form method="post" enctype="multipart/form-data" class="col-md-6">
        {% csrf_token %}

        {% for field in form %}
            <div class="mb-3">
                <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="text-danger small mt-1">{{ field.errors }}</div>
                {% endif %}
            </div>
        {% endfor %}

        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'catalog:home' %}" class="btn btn-outline-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
