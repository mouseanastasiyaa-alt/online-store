<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Skystore</h5>
    <nav class="ms-5 d-flex gap-2">
        <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:home' %}">Каталог</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'blog:post_list' %}">Блог</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:contacts' %}">Контакты</a>
    </nav>
    <div class="ms-3">
        {% if user.is_authenticated %}
            <a href="{% url 'users:profile' %}" class="btn btn-sm btn-outline-primary me-2">Профиль</a>
            <span class="me-2">{{ user.email }}</span>
            <form method="post" action="{% url 'users:logout' %}" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-sm btn-outline-secondary">Выйти</button>
            </form>
        {% else %}
            <a class="btn btn-sm btn-outline-primary" href="{% url 'users:login' %}">Войти</a>
            <a class="btn btn-sm btn-primary" href="{% url 'users:register' %}">Регистрация</a>
        {% endif %}
    </div>
</div>
