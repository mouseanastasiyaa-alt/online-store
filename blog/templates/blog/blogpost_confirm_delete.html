{% extends "base.html" %}

{% block title %}Удалить статью — Skystore{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1>Удалить статью?</h1>

    <p>Вы уверены, что хотите удалить статью <strong>«{{ post.title }}»</strong>? Это действие нельзя отменить.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'blog:post_detail' pk=post.pk %}" class="btn btn-outline-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
